<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tumodo Growth Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: ink brand bar; left nav grouped by role (Me / Team / Talent Development); working column of panels; right drawer for people, requests and forms */
:root{
  --brand:#005AFF; --ink:#0A0A41; --paper:#FFFFFF;
  --bg:#F4F6FC; --surface:#FFFFFF; --surface-2:#EEF2FC; --fg:#0A0A41; --muted:#5B6185; --line:#DCE2F2;
  --accent:#005AFF; --accent-soft:#E3EDFF; --on-accent:#FFFFFF;
  --ok:#11845B; --ok-soft:#DDF4EA; --warn:#A86A00; --warn-soft:#FFF1D6; --bad:#C33A3A; --bad-soft:#FBE3E3;
  --bar:#0A0A41; --bar-muted:#A9B1E0; --avatar:#0A0A41; --shade:rgba(10,10,65,.38);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#07072E; --surface:#0F1045; --surface-2:#171959; --fg:#EDEFFF; --muted:#A3A8D6; --line:#272B70;
  --accent:#4D8BFF; --accent-soft:#16245E; --on-accent:#FFFFFF;
  --ok:#4CD39A; --ok-soft:#0E3A2C; --warn:#F2B74B; --warn-soft:#3A2C0C; --bad:#F27C7C; --bad-soft:#3E1520;
  --bar:#04041F; --bar-muted:#8F96CF; --avatar:#005AFF; --shade:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07072E; --surface:#0F1045; --surface-2:#171959; --fg:#EDEFFF; --muted:#A3A8D6; --line:#272B70;
  --accent:#4D8BFF; --accent-soft:#16245E; --on-accent:#FFFFFF;
  --ok:#4CD39A; --ok-soft:#0E3A2C; --warn:#F2B74B; --warn-soft:#3A2C0C; --bad:#F27C7C; --bad-soft:#3E1520;
  --bar:#04041F; --bar-muted:#8F96CF; --avatar:#005AFF; --shade:rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.02em}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.sub{color:var(--muted);font-size:13.5px}
.meta{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:grid;gap:14px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:#fff}
.bar .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:11px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em}
.logo i{width:26px;height:26px;border-radius:7px;background:#005AFF;display:grid;place-items:center;font-style:normal;font-size:15px;color:#fff}
.logo small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--bar-muted)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--bar-muted);margin-left:auto}
.who select{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:7px;padding:6px 8px;max-width:270px}
.who select option,.who select optgroup{color:#0A0A41;background:#fff}
.demo{background:var(--accent-soft);font-size:13px}
.demo .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:7px}
.demo b{color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.clock{margin-left:auto;display:flex;gap:8px;align-items:center}

/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:24px;max-width:1320px;margin:0 auto;padding-block:20px 72px}
nav.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);align-self:start;display:grid;gap:16px}
nav.side .grp{display:grid;gap:2px}
nav.side .grp>span{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;padding:0 10px 4px}
nav.side button{display:flex;justify-content:space-between;align-items:center;text-align:left;border:0;background:none;border-radius:8px;padding:8px 10px;font-weight:600;color:var(--fg);font-size:14px}
nav.side button:hover{background:var(--surface-2)}
nav.side button[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700}
nav.side button[aria-current="page"] .badge{background:#fff;color:#005AFF}
main{display:grid;gap:20px;align-content:start;min-width:0}
.pagehead{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.pagehead h1{font-size:28px}
.pagehead .filters{flex-wrap:nowrap}
.pagehead .filters .field{flex:0 1 200px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h2{font-size:20px}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.grid-even{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-align:left}

.hero{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center}
.avatar{width:54px;height:54px;border-radius:15px;background:var(--avatar);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:19px;flex:none}
.avatar.sm{width:36px;height:36px;border-radius:10px;font-size:13px}
.hero h1{font-size:26px}
.stats{display:flex;gap:22px;flex-wrap:wrap}
.stats div b{display:block;font-family:var(--display);font-size:25px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.1}
.stats div span{font-size:12.5px;color:var(--muted)}

.plan{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.focus{background:var(--surface-2);border-radius:12px;padding:14px;display:grid;gap:10px;align-content:start}
.focus .why{font-size:12.5px;font-weight:700;color:var(--accent)}
.focus h3{font-size:19px}
.course{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.course b{display:block;font-size:14px}
.course small{color:var(--muted);font-size:12.5px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;align-content:start}
.ccard h3{font-family:var(--body);font-size:15.5px;font-weight:700}
.ccard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--surface-2);font-size:12px;font-weight:600;color:var(--muted)}
.tag.on{background:var(--accent-soft);color:var(--accent)}

.tier,.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.t-Standout{background:var(--ok-soft);color:var(--ok)} .t-Top,.t-Strong{background:var(--accent-soft);color:var(--accent)}
.t-Core{background:var(--warn-soft);color:var(--warn)} .t-Underperforming{background:var(--bad-soft);color:var(--bad)} .t-none{background:var(--surface-2);color:var(--muted)}
.p-wait{background:var(--warn-soft);color:var(--warn)} .p-go{background:var(--accent-soft);color:var(--accent)}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-mute{background:var(--surface-2);color:var(--muted)}

form{display:grid;gap:14px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.field{display:grid;gap:5px;min-width:0}
.field label,.field>span{font-size:13px;font-weight:600}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
input[type=checkbox]{width:auto}
textarea{min-height:72px;resize:vertical}
.notice{border-radius:10px;padding:10px 12px;font-size:13.5px}
.n-ok{background:var(--ok-soft);color:var(--ok)} .n-warn{background:var(--warn-soft);color:var(--warn)} .n-bad{background:var(--bad-soft);color:var(--bad)} .n-info{background:var(--accent-soft);color:var(--fg)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.filters .field{flex:1 1 150px;max-width:240px}

.req{border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;background:var(--surface)}
.req-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.req-top>.stack{align-content:start}
.req h3{font-size:16.5px;font-family:var(--body);font-weight:700}
.track{display:flex;overflow-x:auto;padding-bottom:2px}
.step{flex:1 0 92px;display:grid;gap:5px;font-size:11.5px;color:var(--muted)}
.step::before{content:"";height:4px;border-radius:2px;background:var(--surface-2);margin-right:3px}
.step.done::before{background:var(--ok)} .step.now::before{background:var(--warn)} .step.stop::before{background:var(--bad)}
.step.done,.step.now,.step.stop{color:var(--fg)} .step b{font-weight:600}
.step i{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.hist{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.hist summary{cursor:pointer;font-weight:600;color:var(--fg)}
.ctx{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.ctx>div{background:var(--surface-2);border-radius:9px;padding:9px 11px;font-size:13px;min-width:0}
.ctx b{display:block;font-size:14.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions input,.actions select{max-width:280px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpis.six{grid-template-columns:repeat(6,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;min-width:0}
.kpi b{display:block;font-family:var(--display);font-weight:800;font-size:25px;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi span{font-size:12.5px;color:var(--muted)}
.meter{height:10px;border-radius:5px;background:var(--surface-2);position:relative;overflow:hidden}
.meter span{position:absolute;top:0;bottom:0;left:0;background:var(--accent);border-radius:5px}
.meter span.pend{background:var(--warn);opacity:.85}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hbars{display:grid;gap:8px}
.hbar{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) 78px;gap:10px;align-items:center;font-size:13.5px}
.hbar .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.hbar .meter{height:12px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;white-space:nowrap}
td.num,th.num{font-variant-numeric:tabular-nums;text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
.scroll{overflow-x:auto}
.heat td.cell{text-align:center;font-variant-numeric:tabular-nums;font-weight:700;border-radius:6px}
.lvl{display:inline-flex;gap:3px;vertical-align:middle}
.lvl i{width:9px;height:9px;border-radius:2px;background:var(--surface-2);display:inline-block}
.lvl i.f{background:var(--accent)} .lvl i.r{outline:2px solid var(--fg);outline-offset:-2px}
.lvl i.f.r{outline-color:var(--fg)}
.delta{font-family:var(--mono);font-size:11.5px}
.up{color:var(--ok)} .down{color:var(--bad)}

.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.member{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;text-align:left}
.member:hover{border-color:var(--accent)}
.member .top{display:flex;gap:10px;align-items:center}
.member .top>div{min-width:0}
.member b{display:block}

.mail{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:16px}
.inbox{display:grid;gap:6px;max-height:640px;overflow:auto;align-content:start}
.inbox button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.inbox button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.inbox button.unread{border-left:4px solid var(--accent)}
.inbox button.unread b{font-weight:800}
.inbox small{color:var(--muted);font-size:12px}
.kind{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.k-action{color:var(--accent)} .k-info{color:var(--ok)} .k-nudge{color:var(--warn)} .k-escalate{color:var(--bad)}
.letter{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;align-self:start}
.letter header{background:#0A0A41;color:#fff;padding:14px 18px;display:grid;gap:3px}
.letter header small{color:#A9B1E0}
.letter .body{padding:18px;display:grid;gap:14px}
.letter .text{white-space:pre-line}
.outlookbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:14px}
.empty{color:var(--muted);text-align:center;padding:26px 12px;border:1px dashed var(--line);border-radius:12px}

.drawer-bg{position:fixed;inset:0;background:var(--shade);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--bg);z-index:41;overflow:auto;box-shadow:-12px 0 40px rgba(10,10,65,.25);
  padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 20px;display:grid;gap:16px;align-content:start}
.drawer .dh{display:flex;justify-content:space-between;gap:12px;align-items:start}
.drawer .dh h2{font-size:22px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0A0A41;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 8px 24px rgba(10,10,65,.3);z-index:60;max-width:calc(100% - 32px)}
.report{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.report header{background:#0A0A41;color:#fff;padding:18px 20px;border-bottom:4px solid #005AFF;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.report header h2{font-size:22px;color:#fff}
.report header small{color:#A9B1E0}
.report .rbody{padding:18px 20px;display:grid;gap:18px}
.report h3{font-size:15px;font-family:var(--body);font-weight:700;margin-bottom:6px}
.scope{display:flex;gap:6px;flex-wrap:wrap}
.scope button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px}
.scope button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}

.ws{display:inline-flex;background:rgba(255,255,255,.1);border-radius:9px;padding:3px;gap:2px}
.ws button{border:0;background:none;color:var(--bar-muted);padding:6px 12px;border-radius:7px;font-weight:700;font-size:13px}
.ws button[aria-pressed="true"]{background:#005AFF;color:#fff}
.srch{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;border-radius:8px;padding:6px 12px;font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.srch:hover{background:rgba(255,255,255,.16)}
.chartbox{background:#fff;border-radius:10px;padding:10px;border:1px solid var(--line);min-width:0}
.chartbox svg{display:block;width:100%;height:auto}
.b-green{background:var(--ok-soft);color:var(--ok)} .b-amber{background:var(--warn-soft);color:var(--warn)} .b-red{background:var(--bad-soft);color:var(--bad)}
.chip{display:inline-block;min-width:52px;text-align:center;border-radius:6px;padding:3px 8px;font-family:var(--mono);font-size:12px;font-weight:600}
.sec{display:grid;gap:14px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.charts2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:16px;align-items:center}
details.fold{border:1px solid var(--line);border-radius:10px;overflow:hidden}
details.fold summary{cursor:pointer;padding:10px 14px;font-weight:700;background:var(--surface-2)}
details.fold>div{padding:10px 14px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:18px;display:grid;gap:8px;justify-items:start;background:var(--surface-2)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}
.tg{display:inline-block;border-radius:6px;padding:3px 9px;font-size:12px;font-weight:600}
.action-box{background:var(--surface-2);border-left:3px solid var(--accent);padding:10px 14px;font-size:13.5px;border-radius:0 8px 8px 0}
.kpi .delta{display:block;margin-top:4px}
.charts2>.chartbox:first-child svg{max-width:250px;margin:0 auto}
@media (max-width:760px){.charts2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:980px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.side{position:static;display:flex;overflow-x:auto;gap:6px;padding-bottom:4px}
  nav.side .grp{display:flex;gap:4px}
  nav.side .grp>span{display:none}
  nav.side button{white-space:nowrap;border:1px solid var(--line);background:var(--surface)}
  .grid2,.grid-even,.mail{grid-template-columns:minmax(0,1fr)}
  .kpis,.kpis.six{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:560px){
  .srch span{display:none}
  .f2,.f3,.plan{grid-template-columns:1fr}
  .kpis,.kpis.six{grid-template-columns:repeat(2,minmax(0,1fr))}

/* ---------- review record maths (as in the Hub) ---------- */
const reqOf=(r,k)=>(r.req&&r.req[k])||EXPECT, impOf=(r,k)=>(r.imp&&r.imp[k])||1;
function att(r){let num=0,den=0;for(const [k,v] of Object.entries(r.scores)){num+=impOf(r,k)*v;den+=impOf(r,k)*reqOf(r,k)}return den?num/den:0}

const band=r=>{const a=att(r)*100,B=D.settings.rb;return a>=B.green?"green":a>=B.amber?"amber":"red"};
const skillBand=(score,req)=>{if(score==null)return "none";const a=100*score/(req||EXPECT),B=D.settings.rb;return a>=B.green?"green":a>=B.amber?"amber":"red"};
const skillChip=(score,req)=>`<span class="chip b-${skillBand(score,req)}">${score==null?"–":Math.min(100,Math.round(100*score/(req||EXPECT)))+"%"}</span>`;
const bandLbl=()=>{const B=D.settings.rb;return {green:`${B.green}–100% of requirement`,amber:`${B.amber}–${B.green-1}% of requirement`,red:`Below ${B.amber}%: needs support`}};
const recAction=b=>b==="green"?`Strong attainment (${D.settings.rb.green}%+): ready for stretch assignments and mentoring others.`:b==="amber"?"Close to requirement: targeted coaching on the highest-importance skills below the bar.":`Below ${D.settings.rb.amber}% of requirement: a structured development plan on the most important skills below the bar; review at the next 1:1 cycle.`;

function topHiLo(r){const e=Object.entries(r.scores);if(!e.length)return [null,null];
  const hi=e.reduce((m,x)=>(x[1]-reqOf(r,x[0]))>(m[1]-reqOf(r,m[0]))?x:m);
  const lacks=e.filter(([k,v])=>v<reqOf(r,k));
  const lo=lacks.length?lacks.reduce((m,x)=>impOf(r,x[0])*(reqOf(r,x[0])-x[1])>impOf(r,m[0])*(reqOf(r,m[0])-m[1])?x:m):null;
  return [hi,lo]}
/* BambooHR fuzzy matching, as in the Hub */
const nkey=n=>String(n).toLowerCase().replace(/\(sample\)/g,'').replace(/[^a-zÀ-ɏ ]/g,' ').replace(/\s+/g,' ').trim();
function tokEq(a,b){if(a===b)return true;if(a.length<5||b.length<5||Math.abs(a.length-b.length)>1)return false;let i=0,j=0,d=0;
  while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;continue}if(++d>1)return false;if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++}}return d+(a.length-i)+(b.length-j)<=1}
function fuzzyIn(name,keys){const k=nkey(name);if(keys.includes(k))return k;const pt=k.split(' ');let best=null,bs=0,ties=0;
  for(const bk of keys){const bt=bk.split(' ');const [small,big]=bt.length<=pt.length?[bt,pt]:[pt,bt];let m=0;for(const s of small)if(big.some(g=>tokEq(s,g)))m++;
    if(m===small.length&&m>=2){if(m>bs){best=bk;bs=m;ties=0}else if(m===bs)ties++}}
  return best&&ties===0?best:null}
function bam(r,cyc){const b=D.reviews[cyc]?.bamboo||{};const k=fuzzyIn(r.name,Object.keys(b));return k?b[k]:null}
function matchPersonName(name){const list=active();const keys=list.map(p=>nkey(p.name));const k=fuzzyIn(name,keys);if(k)return list[keys.indexOf(k)];
  const rev=nkey(String(name).split(",").map(s=>s.trim()).reverse().join(" "));const i=keys.indexOf(rev);return i>=0?list[i]:null}

/* ---------- talent profile used by Growth ---------- */
function profile(p,cyc,force){
  if(!p||(!force&&!D.settings.reviewOn)) return null;
  const order=D.cycles.filter(pubCyc).map(c=>c.id), ids=cyc?[cyc]:[...order].reverse();
  for(const cid of ids){
    const rec=recFor(p.id,cid); if(!rec||!Object.keys(rec.scores).length) continue;
    const rows=Object.keys(rec.scores).map(skill=>({skill,imp:impOf(rec,skill),req:reqOf(rec,skill),score:rec.scores[skill]}));
    const gaps=rows.filter(r=>r.score<r.req).sort((a,b)=>(b.req-b.score)*b.imp-(a.req-a.score)*a.imp);
    const strengths=rows.filter(r=>r.score>=r.req).sort((a,b)=>(b.score-b.req)-(a.score-a.req)||b.imp-a.imp);
    const pi=order.indexOf(cid)-1, prevRec=pi>=0?recFor(p.id,order[pi]):null, match=Math.round(100*att(rec));
    return {cycle:cid,rec,rows,match,gaps,strengths,prev:prevRec?prevRec.scores:null,prevCycle:prevRec?order[pi]:null,prevMatch:prevRec?Math.round(100*att(prevRec)):null,tier:p.tierOverride||tierOf(match),band:band(rec)};
  }
  return null;
}
function tierOf(m){const b=D.settings.bands;return m>=b.Standout?"Standout":m>=b.Top?"Top":m>=b.Strong?"Strong":m>=b.Core?"Core":"Underperforming"}
const tierChip=pr=>pr?`<span class="tier t-${pr.tier}">${pr.tier}</span>`:`<span class="tier t-none">Not scored</span>`;

function growthPlan(p){

  if(pr){
    pr.gaps.slice(0,2).forEach((g,i)=>add(g.skill,i===0?"Highly valued in your role":"Chosen often by people in roles like yours"));
    const nx=p.nextRole&&critForRole(p.region,p.nextRole);

    const st=pr.strengths.find(s=>D.catalog.some(c=>courseFor(c,s.skill))); if(st) add(st.skill,"Builds on something you already do well");

}

function buildChain(pid,cost){
  const p=person(pid), chain=[], S=D.settings;
  if(p.mgr) chain.push({k:"manager",who:p.mgr});
  if(pid!==TD) chain.push({k:"td",who:TD});
  const head=dept(p.dept).head;
  if(S.headStep&&cost>0&&head&&head!==p.mgr&&head!==pid&&person(head)?.status==="active") chain.push({k:"head",who:head});
  const gm=region(p.region).gm;
  if(cost>0&&cost>=S.gmThreshold&&gm&&gm!==pid&&person(gm)?.status==="active") chain.push({k:"gm",who:gm});
  return chain;
}

function decide(r,actor,decision,note){
  const s=r.chain[r.step];

    if(s.k==="td"&&r.cost>poolUse(poolOf(r)).left) return `Not enough left in the ${POOLNAME[poolOf(r)]}. Reject it or raise the pool in Settings.`;
    hist(r,pname(actor),`Approved as ${STEPNAME[s.k].toLowerCase()}${note?": "+note:""}`); r.step++;
    if(r.step<r.chain.length){mail(r.pid,"info",`${first(actor)} approved "${r.title}"`,`Next: ${pname(r.chain[r.step].who)} (${STEPNAME[r.chain[r.step].k]}).`,{rid:r.id});askStep(r)} else approveFinal(r);
    return null;
  }
  if(decision==="reject"){ if(!note) return "Add a short reason so they know what to change.";
    hist(r,pname(actor),"Not approved: "+note); r.status="rejected";
    mail(r.pid,"info",`Update on "${r.title}"`,`${pname(actor)} did not approve this request.\n\nReason: ${note}\n\nYou can talk it through and send a revised request any time.`,{rid:r.id}); return null; }
  if(decision==="ask"){ if(!note) return "Type your question first.";
    hist(r,pname(actor),"Asked a question: "+note); r.status="info"; r.q=note;
    mail(r.pid,"action",`${first(actor)} has a question about "${r.title}"`,`${pname(actor)} asked:\n"${note}"\n\nReply below and it goes straight back to them.`,{rid:r.id,act:"answer"}); return null; }
}

const CC={ink:'#0A0A41',blue:'#005AFF',green:'#2E9E5B',amber:'#E6A817',red:'#D64545',muted:'#5B6185',line:'#E3E4EE'};
const svgOpen=(w,h)=>`<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family:Figtree,Arial,sans-serif">`;
const bandColor=a=>a>=D.settings.rb.green/100?CC.green:a>=D.settings.rb.amber/100?CC.amber:CC.red;
function donutSVG(recs){
  const cnt={green:0,amber:0,red:0}; recs.forEach(p=>cnt[band(p)]++); const total=recs.length, R=70, r=44, cx=110, cy=100; let a0=-Math.PI/2, s=svgOpen(220,200);
  [['green',CC.green],['amber',CC.amber],['red',CC.red]].forEach(([k,col])=>{ if(!cnt[k]) return;
    const a1=a0+2*Math.PI*cnt[k]/total-(cnt[k]===total?1e-4:0), large=(a1-a0)>Math.PI?1:0;
    const p0=[cx+R*Math.cos(a0),cy+R*Math.sin(a0)],p1=[cx+R*Math.cos(a1),cy+R*Math.sin(a1)],q1=[cx+r*Math.cos(a1),cy+r*Math.sin(a1)],q0=[cx+r*Math.cos(a0),cy+r*Math.sin(a0)];
    s+=`<path d="M${p0} A${R} ${R} 0 ${large} 1 ${p1} L${q1} A${r} ${r} 0 ${large} 0 ${q0} Z" fill="${col}" stroke="#fff" stroke-width="2"/>`;
    const mid=(a0+a1)/2; s+=`<text x="${cx+(R+r)/2*Math.cos(mid)}" y="${cy+(R+r)/2*Math.sin(mid)+4}" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">${cnt[k]}</text>`; a0=a1;});
  return s+`<text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="20" font-weight="700" fill="${CC.ink}">${total}</text><text x="${cx}" y="${cy+15}" text-anchor="middle" font-size="11" fill="${CC.muted}">people</text></svg>`;
}
function regionBarsSVG(recs){
  const regs=[...new Set(recs.map(p=>p.regionName))].sort(), atts=regs.map(r=>{const g=recs.filter(p=>p.regionName===r);return g.reduce((a,p)=>a+att(p),0)/g.length});
  const W=460,H=210,pl=42,pb=26,TOP=1.2,cw=(W-pl-10)/Math.max(1,regs.length); let s=svgOpen(W,H);

  const ye=H-pb-(H-pb-14)*1.0/TOP; s+=`<line x1="${pl}" y1="${ye}" x2="${W-6}" y2="${ye}" stroke="${CC.ink}" stroke-dasharray="5 4" stroke-width="1.6"/><text x="${W-8}" y="${ye-5}" text-anchor="end" font-size="10" fill="${CC.ink}" font-weight="600">Full requirement (100%)</text>`;

    s+=`<rect x="${x}" y="${H-pb-bh}" width="${cw*.6}" height="${bh}" rx="4" fill="${bandColor(atts[i])}"/><text x="${x+cw*.3}" y="${H-pb-bh-6}" text-anchor="middle" font-size="12" font-weight="700" fill="${CC.ink}">${Math.round(atts[i]*100)}%</text><text x="${x+cw*.3}" y="${H-8}" text-anchor="middle" font-size="12" fill="${CC.muted}">${esc(r)}</text>`});
  return s+'</svg>';
}
function nineboxSVG(recs,cyc,clickable=true){
  const pts=recs.filter(p=>bam(p,cyc)&&bam(p,cyc).rating!=null), W=640,H=470,pl=58,pb=48,pt=16,pr=16,Y0=0.6,Y1=1.2;
  const X=v=>pl+(W-pl-pr)*(v-1)/4, Y=v=>{const c=Math.max(Y0,Math.min(Y1,v));return H-pb-(H-pb-pt)*(c-Y0)/(Y1-Y0)}; let s=svgOpen(W,H);
  [[1,3,Y0,0.8,'#F6D5D5'],[3,5,Y0,0.8,'#FBEBC9'],[1,3,0.8,0.9,'#FBEBC9'],[3,5,0.8,0.9,'#EFF7E6'],[1,3,0.9,Y1,'#FBEBC9'],[3,4,0.9,Y1,'#DCEFD9'],[4,5,0.9,Y1,'#BFE6BF']].forEach(([x0,x1,y0,y1,c])=>{s+=`<rect x="${X(x0)}" y="${Y(y1)}" width="${X(x1)-X(x0)}" height="${Y(y0)-Y(y1)}" fill="${c}"/>`});

function gapWeights(sub){const gaps={};sub.forEach(p=>Object.entries(p.scores).forEach(([k,v])=>{const rq=reqOf(p,k);if(v<rq)gaps[k]=(gaps[k]||0)+impOf(p,k)*(rq-v)}));return gaps}

      const scores={};skills.forEach((sk,i)=>{const v=row[cols[i]];if(typeof v==="number")scores[sk]=v});if(!Object.keys(scores).length)continue;

const x2from=m=>m.from==="Tumodo Growth Hub"?"Tumodo Growth Hub <growthhub@tumodo.example>":m.from==="Talent Development"?`Talent Development <${D.settings.tdEmail}>`:m.from;
function mailActions(m,box){
  if(m.act==="prog"||m.act==="mentor"){
    const g=m.act==="prog"?D.programmes.find(x=>x.id===m.pg):null, ms=m.act==="mentor"?D.mentorships.find(x=>x.id===m.ms):null;
    const live=m.to===box&&!m.done&&(g?g.status==="planned"&&g.participants.some(x=>x.pid===box&&x.status==="invited"):ms&&ms.status==="requested");
    if(m.done) return `<div class="outlookbar"><span class="pill p-ok">${esc(m.done)}</span></div>`;
    if(!live) return `<div class="outlookbar"><span class="meta">Nothing to do.</span></div>`;
    return `<div class="outlookbar"><button class="btn ok" data-mact="${m.act}_yes" data-m="${m.id}">Accept</button><button class="btn" data-mact="${m.act}_no" data-m="${m.id}">Decline</button></div>`;
  }
  if(m.act==="score") return `<div class="outlookbar"><button class="btn primary" data-gotoscore="1">Open scoring in the Growth Hub</button></div>`;
  if(m.act==="calib") return `<div class="outlookbar"><button class="btn primary" data-gotocalib="1">Open calibration in the Growth Hub</button></div>`;
  if(m.pid) return `<div class="outlookbar"><button class="btn sm" data-person="${m.pid}">Open ${esc(first(m.pid))}'s plan</button></div>`;
  const r=D.reqs.find(x=>x.id===m.rid), open=r?`<button class="btn sm" data-gotoreq="${r.id}">Open in Growth Hub</button>`:"";
  if(!r||m.to!==box||!m.act) return `<div class="outlookbar">${open}</div>`;
  if(m.done) return `<div class="outlookbar"><span class="pill p-ok">${esc(m.done)}</span>${open}</div>`;
  const live=(m.act==="approve"&&r.status==="pending"&&r.step===m.step&&r.chain[r.step].who===box)||(m.act==="gmreply"&&r.status==="pending"&&r.chain[r.step].k==="gm"&&!r.gmReply)||(m.act==="answer"&&r.status==="info"&&r.pid===box)||(m.act==="impact"&&r.status==="completed");
  if(!live) return `<div class="outlookbar"><span class="meta">This request has moved on. Nothing to do.</span>${open}</div>`;
  const k=r.chain[r.step]?.k;
  if(m.act==="approve") return `<div class="outlookbar"><textarea id="mc_${m.id}" placeholder="${r.sponsor&&k==="manager"?"Your written reason (required to approve)":"Comment (required to reject or ask)"}" aria-label="Comment"></textarea>
    <button class="btn ok" data-mact="approve" data-m="${m.id}">Approve</button><button class="btn bad" data-mact="reject" data-m="${m.id}">Reject</button>${k==="manager"?`<button class="btn" data-mact="ask" data-m="${m.id}">Ask a question</button>`:""}${open}</div>`;
  if(m.act==="gmreply") return `<div class="outlookbar"><textarea id="mc_${m.id}" placeholder="Your reply (optional)" aria-label="Reply"></textarea><button class="btn ok" data-mact="gm_yes" data-m="${m.id}">Reply: Approved</button><button class="btn bad" data-mact="gm_no" data-m="${m.id}">Reply: Not approved</button></div>`;
  if(m.act==="answer") return `<div class="outlookbar"><textarea id="mc_${m.id}" placeholder="Your answer" aria-label="Answer"></textarea><button class="btn primary" data-mact="answer" data-m="${m.id}">Send answer</button>${open}</div>`;
  if(m.act==="impact") return `<div class="outlookbar">${["Clear change in results","Some change","No visible change yet"].map(x=>`<button class="btn" data-mact="impact" data-v="${x}" data-m="${m.id}">${x}</button>`).join("")}</div>`;
  return "";
}

/* ============================== BambooHR people sync ============================== */
function parseCSV(t){const rows=[];let row=[],cell="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}else if(ch==='"')q=true;else if(ch===","){row.push(cell);cell=""}else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;row.push(cell);rows.push(row);row=[];cell=""}else cell+=ch}if(cell||row.length){row.push(cell);rows.push(row)}return rows.filter(r=>r.some(c=>c.trim()))}
const norm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
function matchDept(s){const n=norm(s);if(!n)return null;const d=D.depts.find(d=>norm(d.name)===n||norm(d.id)===n);if(d)return d.id;if(/sales|commercial|kam/.test(n))return "commercial";if(/hr|people|culture/.test(n))return "pc";if(/ops|operation/.test(n))return "operations";if(/financ|account/.test(n))return "finance";if(/market/.test(n))return "marketing";return null}
function matchRegion(s){const n=norm(s);if(!n)return null;const r=D.regions.find(r=>norm(r.name)===n||norm(r.id)===n||n.includes(norm(r.name)));if(r)return r.id;if(/uae|dubai|abudhabi/.test(n))return "dubai";if(/ksa|saudi|riyadh|jeddah/.test(n))return "ksa";if(/india|bangalore|bengaluru|mumbai|delhi/.test(n))return "india";if(/germany|berlin|munich|frankfurt/.test(n))return "germany";if(/kazakh|almaty|astana|^kz$/.test(n))return "kz";return null}
function findPerson(s){const n=norm(s);if(!n)return null;const hit=p=>norm(p.email)===n||norm(p.name)===n||norm(p.name.split(" ").reverse().join(" "))===n;return D.people.find(p=>p.status==="active"&&hit(p))||D.people.find(hit)||null}
function syncPreview(text){
  const rows=parseCSV(text); if(rows.length<2) return {errors:["Paste a header row and at least one person."],add:[],upd:[],gone:[]};
  const h=rows[0].map(norm), col=k=>h.findIndex(x=>k.some(y=>x.includes(y)));
  const ci={name:col(["name"]),email:col(["email","mail"]),title:col(["jobtitle","title","position"]),dept:col(["department","dept"]),loc:col(["location","region","country"]),mgr:col(["reportsto","manager","supervisor"])};
  if(ci.email<0||ci.name<0) return {errors:["The export needs Name and Email columns."],add:[],upd:[],gone:[]};
  const errors=[], seen=new Set(), add=[], upd=[];
  rows.slice(1).forEach((r,i)=>{
    let name=(r[ci.name]||"").trim(); if(name.includes(",")) name=name.split(",").map(s=>s.trim()).reverse().join(" ");
    const email=(r[ci.email]||"").trim().toLowerCase(); if(!email){errors.push(`Row ${i+2}: no email, skipped.`);return}
    const rec={name,email,title:(r[ci.title]||"").trim(),dept:matchDept(r[ci.dept]),region:matchRegion(r[ci.loc]),mgrRaw:(r[ci.mgr]||"").trim()};
    const ex=D.people.find(p=>p.email.toLowerCase()===email); seen.add(email);
    if(!ex){add.push({...rec,on:true,note:`${rec.title||"No title"} · ${rec.dept?dept(rec.dept).name:"department not recognised"} · ${rec.region?region(rec.region).name:"location not recognised"}${rec.mgrRaw?" · reports to "+rec.mgrRaw:""}`});return}
    const ch=[]; if(rec.title&&rec.title!==ex.title)ch.push(`title: ${ex.title} → ${rec.title}`); if(rec.dept&&rec.dept!==ex.dept)ch.push(`department: ${dept(ex.dept).name} → ${dept(rec.dept).name}`);
    if(rec.region&&rec.region!==ex.region)ch.push(`region: ${region(ex.region).name} → ${region(rec.region).name}`);
    const m=rec.mgrRaw?findPerson(rec.mgrRaw):null; if(m&&m.id!==ex.mgr)ch.push(`manager: ${pname(ex.mgr)||"none"} → ${m.name}`); if(ex.status==="left")ch.push("returning (marked as left)");
    if(ch.length) upd.push({...rec,id:ex.id,on:true,note:ch.join("; ")});
  });
  const gone=active().filter(p=>!seen.has(p.email.toLowerCase())).map(p=>({id:p.id,name:p.name,note:`${p.title} · ${dept(p.dept).name}`,on:false}));
  return {errors,add,upd,gone};
}
function newPid(name){return slug(name).replace(/\./g,"")+nid("","uid")}
function syncApply(d){
  let a=0,u=0,g=0;
  for(const x of d.add.filter(x=>x.on)){D.people.push({id:newPid(x.name),name:x.name,email:x.email,title:x.title||"Employee",dept:x.dept||"commercial",region:x.region||"dubai",mgr:null,nextRole:"",joined:iso(D.now),status:"active",mgrRaw:x.mgrRaw});a++}
  for(const p of D.people.filter(p=>p.mgrRaw)){const m=findPerson(p.mgrRaw);p.mgr=m?m.id:null;delete p.mgrRaw}
  for(const x of d.upd.filter(x=>x.on)){const p=person(x.id);if(x.title)p.title=x.title;if(x.dept)p.dept=x.dept;if(x.region)p.region=x.region;const m=x.mgrRaw?findPerson(x.mgrRaw):null;if(m)p.mgr=m.id;if(p.status==="left"){p.status="active";delete p.left}u++}
  for(const x of d.gone.filter(x=>x.on)){markLeft(person(x.id),iso(D.now),person(x.id).mgr||"ceo");g++}
  relinkRecords();
  return `${a} added, ${u} updated, ${g} marked as left.`;
}
function relinkRecords(){Object.values(D.reviews).forEach(R=>R.records.forEach(r=>{if(!r.pid){const m=matchPersonName(r.name);if(m)r.pid=m.id}}))}
function markLeft(p,date,newMgr){
  p.status="left"; p.left=date; reportsOf(p.id).forEach(x=>x.mgr=newMgr);
  D.reqs.filter(r=>r.status==="pending"&&r.chain[r.step].who===p.id).forEach(r=>{r.chain[r.step].who=newMgr;hist(r,"Growth Hub",`Approver changed to ${pname(newMgr)} (${p.name} left)`);askStep(r)});
  D.reqs.filter(r=>r.pid===p.id&&(OPEN.includes(r.status)||r.status==="approved")).forEach(r=>{hist(r,"Talent Development",`Cancelled: ${p.name} left the company`);r.status="cancelled";if(r.pay&&r.pay.status==="requested")r.pay=null});
  if(p.mgr) mail(p.mgr,"info",`${p.name} has left: development records closed`,`Their open requests were cancelled. Completed learning and review history stay in the reports.`,{});
}


/* ============================== access & scopes ============================== */
const isCompany=id=>id===TD||D.access.company.includes(id);
function scopesOf(id){
  const s=[], add=(key,label,ppl)=>{if(!s.some(x=>x.key===key))s.push({key,label,ppl})};
  if(isCompany(id)) add("company","Whole company",()=>active());
  D.regions.filter(r=>r.gm===id).forEach(r=>add("region:"+r.id,r.name+" region",()=>active().filter(p=>p.region===r.id)));
  D.access.regionHeads.filter(x=>x.pid===id).forEach(x=>add("region:"+x.region,region(x.region).name+" region",()=>active().filter(p=>p.region===x.region)));
  D.depts.filter(d=>d.head===id&&d.id!=="leadership").forEach(d=>add("dept:"+d.id,d.name+" department",()=>active().filter(p=>p.dept===d.id)));
  if(isMgr(id)){add("team:direct","My direct team",()=>reportsOf(id));if(below(id).length>reportsOf(id).length)add("team:all","My whole team",()=>below(id))}
  return s;
}
const scopeByKey=(id,key)=>scopesOf(id).find(s=>s.key===key)||scopesOf(id)[0];
const isLeader=id=>scopesOf(id).some(s=>!s.key.startsWith("team"));
function canSee(viewer,pid){if(viewer===pid)return true;return scopesOf(viewer).some(s=>s.ppl().some(p=>p.id===pid))}
function logA(what){D.audit.push({t:D.now,by:pname(U.me),what})}
function delegateOf(id){const d=D.delegations[id];return d&&d.to&&Date.parse(d.until)>=D.now-DAY&&person(d.to)?.status==="active"?d.to:null}

/* ============================== impact ============================== */
const cycTime=c=>c&&c.date?Date.parse(c.date):null;
function scoreAt(pid,skill,before,t){
  const cs=D.cycles.filter(c=>pubCyc(c)&&cycTime(c)!=null&&(before?cycTime(c)<t:cycTime(c)>t)).sort((a,b)=>cycTime(a)-cycTime(b));
  for(const c of (before?cs.reverse():cs)){const r=recFor(pid,c.id);if(!r)continue;const k=Object.keys(r.scores).find(x=>sameSkill(x,skill));if(k!=null)return {cyc:c.id,score:r.scores[k],req:reqOf(r,k)}}
  return null;
}
function impactRows(ids){
  const set=new Set(ids), rows=[];
  D.reqs.filter(r=>set.has(r.pid)&&["completed","closed"].includes(r.status)&&r.completedAt).forEach(r=>rows.push({pid:r.pid,what:r.title,kind:"Request",skill:r.skill,t:r.completedAt,cost:r.cost,check:r.impact||"",hours:r.hours||0}));
  D.programmes.filter(g=>g.status==="done").forEach(g=>{const att=g.participants.filter(x=>x.status==="attended");att.filter(x=>set.has(x.pid)).forEach(x=>rows.push({pid:x.pid,what:g.title,kind:"Group programme",skill:g.skill,t:Date.parse(g.date),cost:Math.round(g.cost/Math.max(1,att.length)),check:"",hours:g.hours||0}))});
  D.selfLearn.filter(l=>set.has(l.pid)).forEach(l=>rows.push({pid:l.pid,what:l.title,kind:"Own learning",skill:l.skill,t:Date.parse(l.date),cost:0,check:"",hours:l.hours||0}));
  rows.forEach(x=>{x.before=scoreAt(x.pid,x.skill,true,x.t);x.after=scoreAt(x.pid,x.skill,false,x.t);x.up=x.before&&x.after?x.after.score-x.before.score:null});
  return rows.sort((a,b)=>b.t-a.t);
}
function impactSummary(rows){
  const m=rows.filter(x=>x.up!=null), cost=m.reduce((a,x)=>a+x.cost,0), pts=m.reduce((a,x)=>a+Math.max(0,x.up),0), checks=rows.filter(x=>x.check);
  return {n:rows.length,measured:m.length,avg:m.length?(m.reduce((a,x)=>a+x.up,0)/m.length):null,improved:m.length?Math.round(100*m.filter(x=>x.up>0).length/m.length):null,
    perPt:pts?Math.round(cost/pts):null,clear:checks.length?Math.round(100*checks.filter(x=>/Clear/.test(x.check)).length/checks.length):null,hours:rows.reduce((a,x)=>a+x.hours,0)};
}

/* ============================== budgets ============================== */
function deptSpend(dp){
  let committed=0,pending=0; for(const r of D.reqs){if(person(r.pid)?.dept!==dp)continue;if(FUNDED.includes(r.status))committed+=r.cost;else if(OPEN.includes(r.status))pending+=r.cost}
  D.programmes.filter(g=>g.status!=="cancelled"&&g.dept===dp).forEach(g=>committed+=g.cost);
  const budget=D.deptBudgets[dp]||0; return {budget,committed,pending,left:budget-committed};
}

function calEvents(ids){
  const set=new Set(ids), ev=[];
  D.reqs.filter(r=>set.has(r.pid)&&r.start&&["approved","booked","completed","closed"].includes(r.status)).forEach(r=>ev.push({t:Date.parse(r.start),what:r.title,who:[r.pid],kind:r.status==="approved"?"To be booked":"Booked",req:r.id}));
  D.programmes.filter(g=>g.status!=="cancelled").forEach(g=>{const w=g.participants.filter(x=>set.has(x.pid)&&x.status!=="declined").map(x=>x.pid);if(w.length||U.me===TD)ev.push({t:Date.parse(g.date),what:g.title,who:w,kind:"Group programme",pg:g.id})});
  return ev.sort((a,b)=>a.t-b.t);
}

function openScoring(name,due,opts={}){

async function handleWorkbooks(files){
  if(!window.XLSX) return toast("The Excel reader didn't load. Reload the page and try again.");
  const cyc=U.up.cyc, out=[]; D.reviews[cyc]=D.reviews[cyc]||{records:[],bamboo:{},uploads:[]};
  for(const file of files){
    if(!/\.xlsx?m?$/i.test(file.name)){out.push({name:file.name,error:"Not an Excel workbook. Skipped."});continue}
    try{const wb=window.XLSX.read(await file.arrayBuffer(),{type:"array"}), sheets={}; wb.SheetNames.forEach(n=>sheets[n]=window.XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null}));
      const res=parseHubFile(file.name,sheets); if(!res.records.length){out.push({name:file.name,error:"No scored people found. Expected skill names in row 8 from column F and people in rows 9 to 23."});continue}
      out.push(applyHubFile(cyc,res));
    }catch(err){out.push({name:file.name,error:"Couldn't read this file as a workbook."})}
  }
  U.up.last=out; toast(`${out.filter(x=>!x.error).length} of ${out.length} file(s) loaded into ${cycName(cyc)}.`); render();
}
async function handleBamboo(file){
  const cyc=U.up.cyc, res=parseBamboo(await file.text());
  if(res.error){U.up.last=[{name:file.name,error:res.error}];return render()}
  D.reviews[cyc].bamboo=res.map; const n=Object.keys(res.map).length, matched=D.reviews[cyc].records.filter(r=>bam(r,cyc)).length;
  D.reviews[cyc].uploads.push({t:D.now,by:pname(U.me),what:`${file.name}: ${n} people (kept the latest of ${res.parsed} records; ${res.older} older-cycle rows superseded)`,kind:"bamboo"});

}

/* ============================== Microsoft sign-in (OAuth 2.0 authorization code + PKCE, no library) ============================== */
const Auth={
  SCOPES:"openid profile offline_access User.Read https://graph.microsoft.com/Sites.ReadWrite.All",
  K:"gh.auth", _t:null,
  authority(){return `https://login.microsoftonline.com/${GH_CONFIG.tenant}/oauth2/v2.0`},
  redirect(){return location.origin+location.pathname},
  load(){ if(Auth._t) return Auth._t; try{Auth._t=JSON.parse(sessionStorage.getItem(Auth.K)||"null")}catch(e){Auth._t=null} return Auth._t; },
  store(t){ Auth._t=t; try{ if(t) sessionStorage.setItem(Auth.K,JSON.stringify(t)); else sessionStorage.removeItem(Auth.K); }catch(e){} },
  rnd(n=48){ const a=new Uint8Array(n); crypto.getRandomValues(a); return btoa(String.fromCharCode(...a)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); },
  async s256(v){ const d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v)); return btoa(String.fromCharCode(...new Uint8Array(d))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); },
  async login(){
    const verifier=Auth.rnd(64), state=Auth.rnd(16); sessionStorage.setItem("gh.pkce",JSON.stringify({verifier,state,view:location.hash}));
    const q=new URLSearchParams({client_id:GH_CONFIG.clientId,response_type:"code",redirect_uri:Auth.redirect(),scope:Auth.SCOPES,response_mode:"query",state,code_challenge:await Auth.s256(verifier),code_challenge_method:"S256",prompt:"select_account"});
    location.assign(`${Auth.authority()}/authorize?${q}`);
    return new Promise(()=>{}); // navigation
  },
  async handleRedirect(){
    const u=new URL(location.href), code=u.searchParams.get("code"), err=u.searchParams.get("error");
    if(err){ throw new Error(u.searchParams.get("error_description")||err); }
    if(!code) return false;
    const p=JSON.parse(sessionStorage.getItem("gh.pkce")||"{}"); if(p.state!==u.searchParams.get("state")) throw new Error("Sign-in state mismatch. Please try again.");
    await Auth.exchange({grant_type:"authorization_code",code,redirect_uri:Auth.redirect(),code_verifier:p.verifier});
    sessionStorage.removeItem("gh.pkce"); history.replaceState(null,"",Auth.redirect()+(p.view||"")); return true;
  },
  async exchange(params){
    const body=new URLSearchParams({client_id:GH_CONFIG.clientId,scope:Auth.SCOPES,...params});
    const r=await fetch(`${Auth.authority()}/token`,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body});
    const j=await r.json(); if(!r.ok||!j.access_token){ throw new Error(j.error_description||j.error||"Sign-in failed"); }
    Auth.store({access_token:j.access_token,refresh_token:j.refresh_token||(Auth.load()||{}).refresh_token||null,exp:Date.now()+(j.expires_in-120)*1000}); return j.access_token;
  },
  async refresh(force){
    const t=Auth.load(); if(!t) return null; if(!force&&t.exp>Date.now()) return t.access_token;
    if(!t.refresh_token){ Auth.store(null); return null; }
    try{ return await Auth.exchange({grant_type:"refresh_token",refresh_token:t.refresh_token}); }catch(e){ Auth.store(null); return null; }
  },
  async token(){ const t=Auth.load(); if(t&&t.exp>Date.now()) return t.access_token; const a=await Auth.refresh(); if(a) return a; return Auth.login(); },
  signOut(){ Auth.store(null); location.assign(`https://login.microsoftonline.com/${GH_CONFIG.tenant}/oauth2/v2.0/logout?post_logout_redirect_uri=${encodeURIComponent(Auth.redirect())}`); },
};

/* ============================== SharePoint backend ==============================
   In production (GH_CONFIG.clientId set) people sign in with their Microsoft 365 account and everything the
   app keeps in D is stored in three SharePoint lists on the HR site, through Microsoft Graph.
   Without a clientId (or with ?demo in the address) the app runs as the demo with sample people.

   Lists (created once by Talent Development from Settings → Platform):
     GH Store          Title(key) Coll(text) Part(number) Data(note) Deleted(yes/no)   everyone: read + add + edit own
     GH Store Private  same columns                                                  managers, leaders, TD only
     GH Mail           Title(id) To Subject Body(note) Act Coll Part Data(note) Deleted Outcome Comment DecidedBy
                       → a Power Automate flow emails each new row and, for approvals, writes the decision back.
   Rows are never deleted: a removed entry is marked Deleted and emptied.
*/
const SP={
  mode:"demo", user:null, realId:null, ready:false, readOnly:false, busy:0, lastSync:0, _q:Promise.resolve(), _snap:{}, _ids:{}, sid:null, lid:{},
  L:{pub:"GH Store",priv:"GH Store Private",mail:"GH Mail"},
  CHUNK:60000, G:"https://graph.microsoft.com/v1.0",
  detect(){
    if(/[?&]demo\b/.test(location.search)) return "demo";
    return GH_CONFIG.clientId&&/^https?:$/.test(location.protocol)?"prod":"demo";
  },
  /* ---------- Microsoft Graph ---------- */
  async graph(path,method="GET",body,extra={}){
    const url=path.startsWith("http")?path:SP.G+path;
    for(let attempt=0;attempt<4;attempt++){
      const tok=await Auth.token(); if(!tok) throw new Error("not signed in");
      const r=await fetch(url,{method,headers:{Authorization:"Bearer "+tok,Accept:"application/json",...(body?{"Content-Type":"application/json"}:{}),...extra},body:body==null?undefined:JSON.stringify(body)});
      if(r.status===429||r.status===503){ const w=+(r.headers.get("Retry-After")||2); await new Promise(res=>setTimeout(res,w*1000)); continue; }
      if(r.status===401&&attempt===0){ await Auth.refresh(true); continue; }
      if(!r.ok){ let t=""; try{t=(await r.json()).error?.message||""}catch(e){} throw Object.assign(new Error(`${method} ${path.split("?")[0]} → ${r.status} ${t}`),{status:r.status}); }
      if(r.status===204) return null; const ct=r.headers.get("content-type")||""; return ct.includes("json")?r.json():r.text();
    }
    throw new Error("Graph kept throttling; try again in a minute.");
  },
  async resolveSite(){
    if(SP.sid) return SP.sid;
    // Pinned ids (set at build time) need no lookup: people with access to the lists alone can still use the hub.
    if(GH_CONFIG.siteId&&GH_CONFIG.lists&&Object.keys(GH_CONFIG.lists).length){ SP.sid=GH_CONFIG.siteId; SP.lid={...GH_CONFIG.lists}; return SP.sid; }
    const s=await SP.graph(`/sites/${GH_CONFIG.siteHost}:${GH_CONFIG.sitePath}?$select=id`); SP.sid=s.id;
    const ls=await SP.graph(`/sites/${SP.sid}/lists?$select=id,displayName&$top=500`); SP.lid={}; for(const l of ls.value||[]) SP.lid[l.displayName]=l.id; return SP.sid;
  },
  listId(title){ const id=SP.lid[title]; if(!id) throw Object.assign(new Error("List not found: "+title),{status:404}); return id; },
  async allItems(title,fields){
    await SP.resolveSite(); const lid=SP.listId(title);
    let url=`/sites/${SP.sid}/lists/${lid}/items?$expand=fields($select=${fields})&$top=999`, out=[];
    try{ while(url){ const j=await SP.graph(url); for(const it of j.value||[]) out.push({Id:it.id,...it.fields}); url=j["@odata.nextLink"]||null; } }
    catch(e){ if(e.status===403) throw e; throw e; }
    return out;
  },
  async addItem(title,fields){ const j=await SP.graph(`/sites/${SP.sid}/lists/${SP.listId(title)}/items`,"POST",{fields}); return j.id; },
  async updateItem(title,id,fields){ return SP.graph(`/sites/${SP.sid}/lists/${SP.listId(title)}/items/${id}/fields`,"PATCH",fields); },
  /* ---------- what lives where ---------- */
  // kind: single (one row), array (one row per element keyed by id), map (one row per key)
  spec(){
    return [
      ["pub","settings","single"],["pub","regions","single"],["pub","depts","single"],["pub","cycles","single"],["pub","deptBudgets","single"],
      ["pub","mentors","single"],["pub","selfLearn","single"],["pub","criteria","single"],["pub","meta","single"],
      ["pub","people","array"],["pub","catalog","array"],["pub","vendors","array"],["pub","reqs","array"],["pub","programmes","array"],["pub","mentorships","array"],
      ["pub","plans","map"],
      ["priv","access","single"],["priv","delegations","single"],["priv","succession","single"],
      ["priv","audit","array"],["priv","reviews","reviews"],
      ["mail","mails","array"],
    ];
  },
  // Flatten D into {list:{key:{coll,json,extra}}}
  flatten(){
    const out={pub:{},priv:{},mail:{}}, J=v=>JSON.stringify(v);
    D.meta={seq:D.seq,mseq:D.mseq,uid:D.uid,lastDaily:D.lastDaily||null,lastDigest:D.lastDigest||null};
    for(const [list,coll,kind] of SP.spec()){
      const v=D[coll]; if(v==null) continue;
      if(kind==="single") out[list][coll]={coll,json:J(v)};
      else if(kind==="array") for(const it of v){ if(!it.id) it.id=nid("a","uid"); out[list][coll+":"+it.id]={coll,json:J(it),extra:coll==="mails"?SP.mailCols(it):null} }
      else if(kind==="map") for(const k of Object.keys(v)) out[list][coll+":"+k]={coll,json:J(v[k])};
      else if(kind==="reviews") for(const cyc of Object.keys(v)){ const R=v[cyc];
        out[list][`rev:${cyc}:bamboo`]={coll:"reviews",json:J(R.bamboo||{})}; out[list][`rev:${cyc}:uploads`]={coll:"reviews",json:J(R.uploads||[])};
        for(const rec of R.records||[]) out[list][`rev:${cyc}:rec:${rec.id}`]={coll:"reviews",json:J(rec)}; }
    }
    return out;
  },
  mailCols(m){ // columns the email flow reads
    const to=m.to===FIN?D.settings.financeEmail:m.to===TD?D.settings.tdEmail:(person(m.to)||{}).email||"";
    const cc=m.cc?(m.cc===TD?D.settings.tdEmail:(person(m.cc)||{}).email||""):"";
    return {To:to,Cc:cc,Subject:(m.subject||"").slice(0,250),Body:m.body||"",Act:m.act||"",Rid:m.rid||""};
  },
  // Rebuild D from rows
  assemble(rows){ // rows: {pub:[...],priv:[...],mail:[...]} raw items
    const base=emptyData(); const byKey={};
    for(const list of ["pub","priv","mail"]) for(const it of rows[list]||[]){
      if(it.Deleted) continue; const k=list+"|"+it.Title; (byKey[k]=byKey[k]||{list,coll:it.Coll,parts:[],row:it}).parts.push([+it.Part||0,it.Data||""]);
    }
    const vals={}; for(const k of Object.keys(byKey)){const e=byKey[k]; e.parts.sort((a,b)=>a[0]-b[0]); const s=e.parts.map(p=>p[1]).join(""); try{vals[k]={list:e.list,coll:e.coll,v:JSON.parse(s),row:e.row,json:s}}catch(err){console.warn("bad row",k)}}
    const Dn=base; Dn.reviews={}; Dn.plans={}; for(const [,coll,kind] of SP.spec()) if(kind==="array") Dn[coll]=[];
    SP._snap={pub:{},priv:{},mail:{}}; SP._ids={pub:{},priv:{},mail:{}};
    for(const k of Object.keys(vals)){
      const {list,coll,v,row,json}=vals[k], key=row.Title; SP._snap[list][key]=json; SP._ids[list][key]=row.Id;
      const [,,kind]=SP.spec().find(s=>s[1]===coll)||[]; if(!kind) continue;
      if(kind==="single") Dn[coll]=v;
      else if(kind==="array"){ if(coll==="mails"){v.outcome=row.Outcome||null;v.comment=row.Comment||"";v.decidedBy=row.DecidedBy||""} Dn[coll].push(v) }
      else if(kind==="map") Dn[coll][key.slice(coll.length+1)]=v;
      else if(kind==="reviews"){ const [,cyc,what,rid]=key.split(":"); const R=Dn.reviews[cyc]=Dn.reviews[cyc]||{records:[],bamboo:{},uploads:[]};
        if(what==="bamboo") R.bamboo=v; else if(what==="uploads") R.uploads=v; else if(what==="rec") R.records.push(v); }
    }
    for(const c of Dn.cycles||[]) Dn.reviews[c.id]=Dn.reviews[c.id]||{records:[],bamboo:{},uploads:[]};
    Dn.mails.sort((a,b)=>(b.t||0)-(a.t||0)); Dn.reqs.sort((a,b)=>(b.created||0)-(a.created||0));
    if(Dn.meta){Dn.seq=Math.max(Dn.seq||0,Dn.meta.seq||0);Dn.mseq=Math.max(Dn.mseq||0,Dn.meta.mseq||0);Dn.uid=Math.max(Dn.uid||0,Dn.meta.uid||0);Dn.lastDaily=Dn.meta.lastDaily||null;Dn.lastDigest=Dn.meta.lastDigest||null}
    Dn.now=Date.now(); return Dn;
  },
  async loadAll(){
    const sel="Title,Coll,Part,Data,Deleted", rows={};
    await SP.resolveSite();
    rows.pub=await SP.allItems(SP.L.pub,sel);
    try{rows.priv=await SP.allItems(SP.L.priv,sel);SP.noPriv=false}catch(e){rows.priv=[];SP.noPriv=true}
    try{rows.mail=await SP.allItems(SP.L.mail,sel+",Outcome,Comment,DecidedBy");SP.noMail=false}catch(e){rows.mail=[];SP.noMail=true}
    SP.lastSync=Date.now(); SP.empty=!rows.pub.length; return SP.assemble(rows);
  },
  async modified(){ // cheap change check: each list's last modified time
    const out={}; await Promise.all(Object.values(SP.L).map(async t=>{ const id=SP.lid[t]; if(!id) return; try{ const l=await SP.graph(`/sites/${SP.sid}/lists/${id}?$select=lastModifiedDateTime`); out[t]=l.lastModifiedDateTime; }catch(e){} })); return out;
  },
  /* ---------- writes ---------- */
  onSave(){ if(SP.mode!=="prod"||!SP.ready||SP.readOnly) return; clearTimeout(SP._t); SP._t=setTimeout(()=>SP.flush(),400); },
  flush(){ SP._q=SP._q.then(()=>SP._flush()).catch(e=>{console.error(e);toast("Couldn't save to SharePoint: "+(e.message||e)+". Your last change may not be stored; reload and try again.")}); return SP._q; },
  async _flush(){
    const cur=SP.flatten(); let n=0; SP.busy++; SP.indicator(true);
    try{
      for(const list of ["pub","priv","mail"]){
        if(list==="priv"&&SP.noPriv) continue; if(list==="mail"&&SP.noMail) continue;
        const snap=SP._snap[list]=SP._snap[list]||{}, ids=SP._ids[list]=SP._ids[list]||{}, title=SP.L[list];
        for(const key of Object.keys(cur[list])){
          const {coll,json,extra}=cur[list][key]; if(snap[key]===json) continue;
          const parts=[]; for(let i=0;i<json.length;i+=SP.CHUNK) parts.push(json.slice(i,i+SP.CHUNK));
          const body={Title:key,Coll:coll,Part:0,Data:parts[0]||"",Deleted:false,...(extra||{})};
          if(ids[key]) await SP.updateItem(title,ids[key],body);
          else ids[key]=await SP.addItem(title,body);
          // extra parts (rare: very large rows)
          const pk=SP._parts=SP._parts||{}; const had=pk[list+"|"+key]||[];
          for(let i=1;i<parts.length;i++){ const b={Title:key,Coll:coll,Part:i,Data:parts[i],Deleted:false}; if(had[i]) await SP.updateItem(title,had[i],b); else had[i]=await SP.addItem(title,b); }
          for(let i=parts.length;i<had.length;i++) if(had[i]) await SP.updateItem(title,had[i],{Deleted:true,Data:""});
          pk[list+"|"+key]=had; snap[key]=json; n++;
        }
        for(const key of Object.keys(snap)){ if(cur[list][key]||!ids[key]) continue; await SP.updateItem(title,ids[key],{Deleted:true,Data:""}); delete snap[key]; n++; }
      }
    } finally { SP.busy--; SP.indicator(false); }
    SP.lastSync=Date.now(); return n;
  },
  indicator(on){ const e=document.getElementById("syncDot"); if(e) e.dataset.on=on?"1":"0"; },
  /* ---------- first-time setup ---------- */
  async ensureLists(){
    await SP.resolveSite();
    const col=(name,type)=>type==="Note"?{name,text:{allowMultipleLines:true,textType:"plain"}}:type==="Number"?{name,number:{decimalPlaces:"none"}}:type==="Boolean"?{name,boolean:{}}:{name,text:{maxLength:255}};
    const cols={pub:["Coll:Text","Part:Number","Data:Note","Deleted:Boolean"],priv:["Coll:Text","Part:Number","Data:Note","Deleted:Boolean"],
      mail:["Coll:Text","Part:Number","Data:Note","Deleted:Boolean","To:Text","Cc:Text","Subject:Text","Body:Note","Act:Text","Rid:Text","Outcome:Text","Comment:Note","DecidedBy:Text"]};
    const made=[];
    for(const l of ["pub","priv","mail"]){
      const title=SP.L[l], want=cols[l].map(c=>c.split(":"));
      if(!SP.lid[title]){ const j=await SP.graph(`/sites/${SP.sid}/lists`,"POST",{displayName:title,description:"Growth Hub data. Do not edit rows by hand.",columns:want.map(([n,t])=>col(n,t)),list:{template:"genericList"}}); SP.lid[title]=j.id; made.push(title); continue; }
      const have=new Set(((await SP.graph(`/sites/${SP.sid}/lists/${SP.lid[title]}/columns?$select=name`)).value||[]).map(c=>c.name));
      for(const [n,t] of want) if(!have.has(n)) await SP.graph(`/sites/${SP.sid}/lists/${SP.lid[title]}/columns`,"POST",col(n,t));
    }
    return made;
  },
  /* ---------- identity ---------- */
  async whoAmI(){ const u=await SP.graph(`/me?$select=mail,userPrincipalName,displayName`); SP.user={email:(u.mail||u.userPrincipalName||"").toLowerCase(),name:u.displayName||"",login:u.userPrincipalName||""}; return SP.user; },
  personFor(email){ email=(email||"").toLowerCase(); if(!email) return null; if(email===(D.settings.tdEmail||"").toLowerCase()) return person(TD)||null; return D.people.find(p=>(p.email||"").toLowerCase()===email)||null; },
  /* ---------- approvals decided by email (written by the flow) ---------- */
  processDecisions(){
    let n=0;
    for(const m of D.mails){ if(!m.outcome||m.done||!m.rid||!["approve","gmreply"].includes(m.act)) continue;
      const r=D.reqs.find(x=>x.id===m.rid); m.done=D.now; n++;
      if(!r||r.status!=="pending"||r.step!==m.step){ continue; }
      const ok=/^approve/i.test(m.outcome), actor=r.chain[r.step].who, prevMe=U.me;
      const err=decide(r,actor,ok?"approve":"reject",m.comment||(ok?"":"Not approved (from email)"));
      if(err) mail(TD,"info",`Could not record ${pname(actor)}'s decision on ${r.title}`,`${pname(actor)} ${ok?"approved":"rejected"} by email but it could not be recorded: ${err}\n\nOpen the request in All requests and record it by hand.`,{rid:r.id});
      else logA(`${pname(actor)} ${ok?"approved":"did not approve"} ${r.id} by email`);
    }

  },
  /* ---------- background refresh ---------- */
  startPolling(){
    setInterval(async()=>{
      if(SP.busy||document.hidden||U.drawer||SP.readOnly) return;
      try{ const m=await SP.modified(); const sig=JSON.stringify(m); if(sig===SP._modSig) return; SP._modSig=sig;
        if(SP._first){SP._first=false;return}
        const Dn=await SP.loadAll(); const keep={now:Date.now()}; D=Object.assign(Dn,keep); if(SP.processDecisions()) save(); render(); }catch(e){console.warn("refresh",e)}

/* ids that never collide between people saving at the same time */
function nid(prefix,counter){
  if(SP.mode!=="prod"){ return prefix+(++D[counter]); }
  ++D[counter]; return prefix+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
}

/* Setup pack: one JSON file with people, departments, regions, catalogue and criteria, imported by TD on first run */
function importPack(pack){
  const P=pack||{}; let n=0;
  if(P.settings) Object.assign(D.settings,P.settings);
  if(P.regions){ D.regions=P.regions.map(r=>({id:r.id,name:r.name,gm:r.gm||null})); }
  if(P.depts){ D.depts=P.depts.map(d=>({id:d.id,name:d.name,head:d.head||null})); if(!D.depts.find(d=>d.id==="leadership")) D.depts.push({id:"leadership",name:"Leadership",head:null}); }
  if(P.people){ for(const p of P.people){ const ex=D.people.find(x=>x.id===p.id||(x.email||"").toLowerCase()===(p.email||"").toLowerCase());
      const rec={id:p.id,name:p.name,title:p.title||"",dept:p.dept||"",region:p.region||"",mgr:p.mgr||null,nextRole:p.nextRole||"",joined:p.joined||iso(D.now),status:p.status||"active",email:(p.email||"").toLowerCase()};
      if(ex) Object.assign(ex,rec); else D.people.push(rec); n++; } }
  if(P.catalog){ for(const c of P.catalog){ if(D.catalog.find(x=>x.id===c.id)) continue; D.catalog.push({id:c.id,title:c.title,provider:c.provider||c.vendor||"",type:c.type||"Technical course",cost:+c.cost||0,skills:Array.isArray(c.skills)?c.skills:String(c.skills||"").split(/;\s*/).filter(Boolean),hours:+c.hours||0,format:c.format||c.fmt||"Online",active:true,...(c.depts?{depts:c.depts}:{})}); } }
  if(P.criteria){ D.criteria=D.criteria||{}; Object.assign(D.criteria,P.criteria); }
  if(P.deptBudgets) Object.assign(D.deptBudgets,P.deptBudgets);
  if(P.access) D.access=P.access;
  if(P.vendors) for(const v of P.vendors){ if(!D.vendors.find(x=>x.name===v.name)) D.vendors.push({id:nid("v","uid"),name:v.name,contact:v.contact||"",email:v.email||"",country:v.country||"",contractEnd:v.contractEnd||"",status:"active",notes:v.notes||""}); }
  for(const p of D.people) if(p.mgr&&!person(p.mgr)) p.mgr=null;
  logA(`Setup pack imported: ${n} people, ${D.depts.length} departments, ${D.catalog.length} courses`);
  return n;
}
